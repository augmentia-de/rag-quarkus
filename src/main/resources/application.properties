quarkus.otel.exporter.otlp.enabled=false

# Global LangChain4j config -> used by @RegisterAiService (Generator, Judge, Contextualizer)
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:sk-or-v1-7622f...a}
quarkus.langchain4j.openai.base-url=https://openrouter.ai/api/v1
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:openai/gpt-oss-120b:free}
quarkus.langchain4j.openai.timeout=300s

# Custom RAG config
rag.llm.endpoint=https://openrouter.ai/api/v1
rag.llm.model=${OPENAI_MODEL:openai/gpt-oss-120b:free}
rag.llm.api-key=${OPENAI_API_KEY:sk-or-v1-7622f2ca22023...3a}
rag.embedding.endpoint=http://localhost:11434/v1
rag.embedding.model=${EMBEDDING_MODEL:mxbai-embed-large:latest}
rag.embedding.api-key=none

rag.auth.api-key=dev-key-change-me

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rag
quarkus.datasource.username=user
quarkus.datasource.password=password

quarkus.hibernate-orm.database.generation=none

# Flyway
quarkus.flyway.enabled=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.clean-disabled=true

quarkus.transaction-manager.default-transaction-timeout=300s

quarkus.log.console.enable=true
quarkus.log.category."com.enterprise.rag".level=INFO
