quarkus.otel.exporter.otlp.enabled=false

# Absolute basics only — everything else goes into profile-specific files
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:sk-or-v1-7622f2ca22023...3a}
quarkus.langchain4j.openai.base-url=https://openrouter.ai/api/v1
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:meta-llama/llama-3.3-70b-instruct:free}

rag.llm.endpoint=https://openrouter.ai/api/v1
rag.llm.model=${OPENAI_MODEL:meta-llama/llama-3.3-70b-instruct:free}
rag.embedding.endpoint=${EMBEDDING_ENDPOINT:http://localhost:11434/v1}
rag.embedding.model=${EMBEDDING_MODEL:mxbai-embed-large:latest}
rag.auth.api-key=${API_KEY:dev-key-change-me}

rag.llm.logging.enabled=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rag
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.clean-disabled=true
quarkus.flyway.validate-on-migrate=false
%dev.quarkus.log.category."org.flywaydb".level=DEBUG
quarkus.transaction-manager.default-transaction-timeout=300s

quarkus.log.console.enable=true
quarkus.log.file.enable=true
quarkus.log.file.path=logs/rag.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.category."de.augmentia.rag".level=DEBUG
quarkus.log.category."de.augmentia.rag.ingestion".level=DEBUG
quarkus.log.category."de.augmentia.rag.ai".level=DEBUG
quarkus.log.category."de.augmentia.rag.engine".level=DEBUG
%prod.quarkus.log.category."de.augmentia.rag".level=WARN

rag.retrieve.top-k=50
rag.retrieve.rrf-k=30
rag.retrieve.similarity-ratio=0.6
